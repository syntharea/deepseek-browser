<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1b1b1f;
      --mid: #6b6b76;
      --card: #f4f4f6;
      --line: #e4e4e8;
      --accent: #4d6bfe;
      --ok: #15803d;
      --err: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17171a;
        --fg: #f2f2f4;
        --mid: #9a9aa4;
        --card: #212126;
        --line: #2e2e35;
        --accent: #7c93ff;
        --ok: #4ade80;
        --err: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; padding: 40px 24px 64px; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .hint { color: var(--mid); margin: 0 0 24px; font-size: 13px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    label > span { color: var(--mid); }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--fg);
      font: inherit;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .check { flex-direction: row; align-items: center; gap: 8px; }
    .check > span { color: var(--fg); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 16px;
      font: inherit;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button.secondary { background: transparent; color: var(--mid); border: 1px solid var(--line); }
    button:disabled { opacity: .55; cursor: default; }
    #status { min-height: 20px; font-size: 13px; white-space: pre-wrap; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
    #models { color: var(--mid); font-size: 13px; }
    #models ul { margin: 6px 0 0; padding-left: 18px; }
    code { background: var(--card); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>DeepSeek</h1>
    <p class="hint">为 DeepSeek 浏览器扩展配置 API Key。模型会显示在侧边栏的模型菜单中，API Key 只保存在本机扩展存储中。</p>
    <div class="card">
      <label>
        <span>API Key</span>
        <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-...">
      </label>
      <label>
        <span>API 地址（可选，默认 https://api.deepseek.com）</span>
        <input id="host" type="text" autocomplete="off" spellcheck="false" placeholder="https://api.deepseek.com">
      </label>
      <label class="check">
        <input id="thinking" type="checkbox">
        <span>启用思考模式（thinking，默认关闭）</span>
      </label>
      <div class="actions">
        <button id="save" type="button">测试并保存</button>
        <button id="remove" type="button" class="secondary">移除 DeepSeek</button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
      <div id="models"></div>
    </div>
  </main>
  <script src="deepseek.js"></script>
</body>
</html>
